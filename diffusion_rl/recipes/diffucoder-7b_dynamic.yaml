# Model arguments
model_name_or_path: "apple/DiffuCoder-7B-Instruct"
torch_dtype: bfloat16
trust_remote_code: true

# Data (overridden by train.sh via --dataset_name)
dataset_name: "../data/example.jsonl"
dataset_prompt_column: question
system_prompt: "You are a helpful assistant."

# Coupled-GRPO trainer config
sync_ref_model: true
ref_model_sync_steps: 64
beta: 0.01
epsilon: 0.5
scale_rewards: false
bf16: true
use_vllm: false
do_eval: false
num_generations: 8
num_iterations: 2
per_device_eval_batch_size: 1
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 1.0e-06
adam_beta1: 0.9
adam_beta2: 0.99
weight_decay: 0.1
max_grad_norm: 0.2
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.0001
num_train_epochs: 1
seed: 42

log_completions: true
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
report_to:
- wandb

output_dir: "./experiment_result/default"   # overridden by train.sh
overwrite_output_dir: true
save_strategy: "steps"
save_steps: 0.1
save_total_limit: 1

# Code execution (semantic reward) goes through the E2B router (scripts/e2b_router.py)
e2b_router_url: 0.0.0.0:8001

# Diffusion generation config
max_prompt_length: 200
max_completion_length: 256
random_masking: true
p_mask_prompt: 0.0
diffusion_steps: 256
generation_batch_size: 16
generation_temperature: 1.0

# Dynamic (curriculum) reward scheduling: start with only the first reward active; when its
# batch-mean exceeds `dynamic_reward_threshold`, shift all weight to the next reward, and so on.
use_dynamic_rewards: true
dynamic_reward_threshold: 0.8
reward_funcs:
- code_format_correctness
- code_syntax_correctness
- code_static_checking_reward
- code_semantic_reward
reward_weights:
- 1.0
- 0.0
- 0.0
- 0.0
