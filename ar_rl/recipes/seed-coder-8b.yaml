# Model arguments
model_name_or_path: ByteDance-Seed/Seed-Coder-8B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa
use_loose_format: true   # Seed-Coder rarely emits the strict <think>/<answer> template

# Data (overridden by train.sh via --dataset_name)
dataset_name: "../data/example.jsonl"
dataset_prompt_column: question
system_prompt: "You are a helpful AI Assistant that provides well-reasoned and detailed responses. You first think about the reasoning process as an internal monologue and then provide the user with the answer. Respond in the following format: <think>\n...\n</think>\n<answer>\n...\n</answer>"

# GRPO trainer config
sync_ref_model: true
ref_model_sync_steps: 64
beta: 0.01
bf16: true
use_vllm: false
do_eval: false
num_generations: 8
num_iterations: 2
per_device_eval_batch_size: 1
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 1.0e-06
adam_beta1: 0.9
adam_beta2: 0.99
weight_decay: 0.1
max_grad_norm: 0.2
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_ratio: 0.0001
num_train_epochs: 1
seed: 42

log_completions: true
log_level: info
logging_first_step: true
logging_strategy: steps
report_to:
- wandb

output_dir: "./experiment_result/default"   # overridden by train.sh
overwrite_output_dir: true
save_strategy: "steps"
save_steps: 100
save_total_limit: 1

# Code execution (semantic reward) goes through the E2B router (scripts/e2b_router.py)
e2b_router_url: 0.0.0.0:8001

# Generation
max_prompt_length: 1024
max_completion_length: 2048
random_masking: true
generation_temperature: 1.0
temperature: 1.0

logging_steps: 10
generation_batch_size: 16

reward_funcs:
- code_semantic_reward
reward_weights:
- 1.0
